<!DOCTYPE html>
<html>
<head>
  <title>UBI ISP CAF Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      padding: 20px;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-bottom: 10px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<h2 style="text-align:center;">UBI ISP - Customer Application Form</h2>

<form id="cafForm">
  <label>CAF Form No. <input type="text" id="cafNo" name="cafNo" readonly></label>
  <label>Name: <input type="text" name="name" required></label>
  <label>Mobile: <input type="text" name="mobile" required></label>
  <label>Address: <input type="text" name="address" required></label>
  <label>Location/Area: <input type="text" name="location" required></label>

  <label>Internet Plan:
    <select name="plan" required>
      <option value="">--Select Plan--</option>
      <option>50 Mbps - ₹499</option>
      <option>100 Mbps - ₹699</option>
      <option>200 Mbps - ₹999</option>
    </select>
  </label>

  <label>Upload Photo: <input type="file" id="photo" accept="image/*" required></label>
  <label>Upload ID Proof: <input type="file" id="idProof" accept="image/*,application/pdf" required></label>

  <label><input type="checkbox" required> I accept the terms and conditions of UBI ISP Policy</label>

  <button type="submit">Generate CAF PDF</button>
</form>

<div id="pdfLink" style="text-align:center;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  document.getElementById('cafNo').value = 'CAF-' + Date.now(); // Auto-generate CAF number

  const form = document.getElementById('cafForm');
  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const cafNo = form.cafNo.value;
    const name = form.name.value;
    const mobile = form.mobile.value;
    const address = form.address.value;
    const location = form.location.value;
    const plan = form.plan.value;

    doc.setFontSize(14);
    doc.text("UBI ISP - Customer Application Form", 20, 20);
    doc.setFontSize(12);
    doc.text(`CAF No: ${cafNo}`, 20, 30);
    doc.text(`Name: ${name}`, 20, 40);
    doc.text(`Mobile: ${mobile}`, 20, 50);
    doc.text(`Address: ${address}`, 20, 60);
    doc.text(`Location: ${location}`, 20, 70);
    doc.text(`Internet Plan: ${plan}`, 20, 80);
    doc.text(`Policy Accepted: Yes`, 20, 90);

    // Handle photo
    const photoFile = document.getElementById('photo').files[0];
    const idFile = document.getElementById('idProof').files[0];

    if (photoFile && photoFile.type.startsWith('image/')) {
      const photoData = await toBase64(photoFile);
      doc.text("Photo:", 20, 100);
      doc.addImage(photoData, 'JPEG', 20, 105, 40, 40);
    }

    if (idFile && idFile.type.startsWith('image/')) {
      const idData = await toBase64(idFile);
      doc.text("ID Proof:", 70, 100);
      doc.addImage(idData, 'JPEG', 70, 105, 60, 40);
    } else if (idFile && idFile.type === 'application/pdf') {
      doc.text("ID Proof (PDF uploaded - not shown):", 70, 100);
    }

    const pdfBlob = doc.output('blob');
    const url = URL.createObjectURL(pdfBlob);

    document.getElementById('pdfLink').innerHTML = `
      <br><a href="${url}" download="CAF_${mobile}.pdf">📄 Download CAF PDF</a>
    `;
  });

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = e => reject(e);
      reader.readAsDataURL(file);
    });
  }
</script>

</body>
</html>
